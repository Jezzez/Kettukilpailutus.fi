<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!--
    Sama tassunjälki kuin logossa (components/FoxMark.tsx). Välilehden
    ikoni on 16 pikseliä leveä: siihen mahtuu yksi siluetti, ei kasvoja.
    Jos muutat tassun muotoa, muuta se molemmissa.
  -->
  <rect width="40" height="40" rx="12" fill="#E8691B"/>
  <g fill="#FFF3E9" transform="translate(20 20) scale(1.15) rotate(-10) translate(-12 -11.65)">
    <ellipse cx="12" cy="16" rx="5.2" ry="4.4"/>
    <ellipse cx="5.6" cy="10.4" rx="2.2" ry="2.9"/>
    <ellipse cx="18.4" cy="10.4" rx="2.2" ry="2.9"/>
    <ellipse cx="9" cy="5.6" rx="2" ry="2.7"/>
    <ellipse cx="15" cy="5.6" rx="2" ry="2.7"/>
  </g>
</svg>
